version: '3'

services:
  trading-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mstr-trading-bot
    environment:
      - TRADING_SYMBOL=MSTR
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      - MA_PERIOD=200
      - TZ=America/Mexico_City
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped
